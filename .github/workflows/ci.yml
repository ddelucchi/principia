name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: Headless build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset headless-debug
      - name: Build
        run: cmake --build --preset headless-debug
      - name: Test
        run: ctest --preset headless-debug

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset headless-sanitize
      - name: Build
        run: cmake --build --preset headless-sanitize
      - name: Test
        run: ctest --preset headless-sanitize
